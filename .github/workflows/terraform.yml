name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: fmt-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  plan-apply-destroy:
    name: terraform-run
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: true
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Resolve Terraform action
        id: tf-action
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=plan" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate AWS role variable
        shell: bash
        run: |
          test -n "${{ vars.AWS_ROLE_ARN }}" || (
            echo "Missing repository variable: AWS_ROLE_ARN"
            exit 1
          )

          test -n "$TF_STATE_BUCKET" || (
            echo "Missing repository variable: TF_STATE_BUCKET"
            exit 1
          )

          test -n "$TF_STATE_KEY" || (
            echo "Missing repository variable: TF_STATE_KEY"
            exit 1
          )

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        shell: bash
        run: |
          INIT_ARGS=(
            -input=false
            -reconfigure
            -backend-config="bucket=$TF_STATE_BUCKET"
            -backend-config="key=$TF_STATE_KEY"
            -backend-config="region=$AWS_REGION"
            -backend-config="encrypt=true"
          )

          if [ -n "$TF_STATE_LOCK_TABLE" ]; then
            INIT_ARGS+=("-backend-config=dynamodb_table=$TF_STATE_LOCK_TABLE")
          fi

          terraform init "${INIT_ARGS[@]}"

      - name: Terraform plan
        if: steps.tf-action.outputs.value == 'plan'
        run: terraform plan -input=false -var="aws_region=${{ env.AWS_REGION }}" -var="aws_profile="

      - name: Terraform apply
        if: steps.tf-action.outputs.value == 'apply'
        run: terraform apply -auto-approve -input=false -var="aws_region=${{ env.AWS_REGION }}" -var="aws_profile="

      - name: Terraform destroy
        if: steps.tf-action.outputs.value == 'destroy'
        run: terraform destroy -auto-approve -input=false -var="aws_region=${{ env.AWS_REGION }}" -var="aws_profile="
