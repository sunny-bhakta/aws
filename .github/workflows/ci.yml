name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # 1. BUILD AND TEST
  # ============================================================
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run unit tests
        run: npm test


  # ============================================================
  # 2. BUILD DOCKER IMAGE + SMOKE TEST
  # ============================================================
  docker:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - build-and-test

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Verify Dockerfile
      # --------------------------------------------------------
      - name: Verify Dockerfile
        run: |
          echo "=========================================="
          echo "Docker build directory"
          echo "=========================================="

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Dockerfile:"
          echo "=========================================="

          cat ./Dockerfile

          echo "=========================================="

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: devops-nestjs-app:ci

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Smoke test
      # --------------------------------------------------------
      - name: Smoke test the container
        run: |
          docker run -d \
            --name app \
            -p 3000:3000 \
            devops-nestjs-app:ci

          echo "Waiting for application..."

          for i in $(seq 1 20); do

            if curl -fsS http://localhost:3000/health; then
              echo ""
              echo "=========================================="
              echo "Health check OK"
              echo "=========================================="
              exit 0
            fi

            sleep 1

          done

          echo "=========================================="
          echo "Container failed to become healthy"
          echo "=========================================="

          docker logs app

          exit 1

      # --------------------------------------------------------
      # Show image size
      # --------------------------------------------------------
      - name: Show image size
        if: always()
        run: |
          echo "=========================================="
          echo "Docker image"
          echo "=========================================="

          docker image ls devops-nestjs-app:ci

      # --------------------------------------------------------
      # Cleanup
      # --------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker rm -f app || true


  # ============================================================
  # 3. PUSH IMAGE TO ECR
  # ============================================================
  push-to-ecr:
    name: push-to-ecr
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - docker

    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Validate GitHub variables
      # --------------------------------------------------------
      - name: Validate required AWS variables
        run: |

          test -n "${{ vars.AWS_ROLE_ARN }}" \
            || (
              echo "Missing repository variable: AWS_ROLE_ARN"
              exit 1
            )

          test -n "${{ vars.ECR_REPOSITORY }}" \
            || (
              echo "Missing repository variable: ECR_REPOSITORY"
              exit 1
            )

      # --------------------------------------------------------
      # OIDC DEBUG INFORMATION
      # --------------------------------------------------------
      - name: Debug OIDC claims
        run: |

          echo "=========================================="
          echo "        GitHub OIDC Debug Information"
          echo "=========================================="

          echo "repository:           ${{ github.repository }}"
          echo "repository_owner:     ${{ github.repository_owner }}"
          echo "repository_owner_id:  ${{ github.repository_owner_id }}"
          echo "repository_id:        ${{ github.repository_id }}"
          echo "ref:                  ${{ github.ref }}"
          echo "event:                ${{ github.event_name }}"
          echo "workflow:             ${{ github.workflow }}"
          echo "workflow_ref:         ${{ github.workflow_ref }}"

          echo ""
          echo "AWS role:"
          echo "${{ vars.AWS_ROLE_ARN }}"

          echo ""
          echo "AWS region:"
          echo "${{ env.AWS_REGION }}"

          echo ""
          echo "Expected OIDC audience:"
          echo "sts.amazonaws.com"

          echo ""
          echo "Expected OIDC subject:"
          echo "repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:ref:${{ github.ref }}"

          echo ""
          echo "=========================================="

      # --------------------------------------------------------
      # AWS OIDC LOGIN
      # --------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |

          echo "=========================================="
          echo "             AWS Identity"
          echo "=========================================="

          aws sts get-caller-identity

          echo "=========================================="

      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Buildx
      # --------------------------------------------------------
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Verify Dockerfile
      # --------------------------------------------------------
      - name: Verify Dockerfile
        run: |

          echo "=========================================="
          echo "Dockerfile being used for ECR build"
          echo "=========================================="

          pwd

          echo ""
          echo "Dockerfile contents:"
          echo "=========================================="

          cat ./Dockerfile

          echo "=========================================="

      # --------------------------------------------------------
      # Build and push Docker image
      # --------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 4. DEPLOY TO ECS
  # ============================================================
  deploy-to-ecs:
    name: deploy-to-ecs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - push-to-ecr

    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # AWS OIDC LOGIN
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |

          echo "=========================================="
          echo "             AWS Identity"
          echo "=========================================="

          aws sts get-caller-identity

          echo "=========================================="

      # --------------------------------------------------------
      # Validate ECS variables
      # --------------------------------------------------------
      - name: Validate deployment variables
        run: |

          test -n "$ECS_CLUSTER" \
            || (
              echo "Missing repository variable: ECS_CLUSTER"
              exit 1
            )

          test -n "$ECS_SERVICE" \
            || (
              echo "Missing repository variable: ECS_SERVICE"
              exit 1
            )

          test -n "$ECR_REPOSITORY" \
            || (
              echo "Missing repository variable: ECR_REPOSITORY"
              exit 1
            )

      # --------------------------------------------------------
      # Get AWS account ID
      # --------------------------------------------------------
      - name: Get AWS account ID
        id: aws
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "AWS Account: $ACCOUNT_ID"

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Get current ECS task definition dynamically
      # --------------------------------------------------------
      - name: Get current task definition
        id: current-task
        run: |

          echo "=========================================="
          echo "Finding current ECS task definition"
          echo "=========================================="

          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "Could not find ECS task definition"
            exit 1
          fi

          echo "Current task definition:"
          echo "$TASK_DEFINITION"

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

      # --------------------------------------------------------
      # Show current containers
      # --------------------------------------------------------
      - name: Show current containers
        run: |

          echo "=========================================="
          echo "Current ECS containers"
          echo "=========================================="

          jq -r '
            .containerDefinitions[]
            | "Container: \(.name) | Image: \(.image)"
          ' task-definition.json

      # --------------------------------------------------------
      # Build new image URI
      # --------------------------------------------------------
      - name: Set new image
        id: image
        run: |

          IMAGE_URI="${{ steps.aws.outputs.account_id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "New Docker image"
          echo "=========================================="

          echo "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Detect container dynamically
      #
      # We use the first container from the current
      # ECS task definition.
      # --------------------------------------------------------
      - name: Detect container
        id: container
        run: |

          CONTAINER_NAME=$(jq -r '
            .containerDefinitions[0].name
          ' task-definition.json)

          if [ -z "$CONTAINER_NAME" ] || [ "$CONTAINER_NAME" = "null" ]; then
            echo "Could not detect ECS container name"
            exit 1
          fi

          echo "=========================================="
          echo "Detected container"
          echo "=========================================="

          echo "$CONTAINER_NAME"

          echo "container_name=$CONTAINER_NAME" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Create new task definition
      # --------------------------------------------------------
      - name: Create new task definition
        run: |

          IMAGE="${{ steps.image.outputs.image }}"
          CONTAINER="${{ steps.container.outputs.container_name }}"

          echo "=========================================="
          echo "Updating ECS task definition"
          echo "=========================================="

          echo "Container: $CONTAINER"
          echo "New image: $IMAGE"

          jq \
            --arg IMAGE "$IMAGE" \
            --arg CONTAINER "$CONTAINER" \
            '
            .containerDefinitions |= map(
              if .name == $CONTAINER
              then .image = $IMAGE
              else .
              end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            ' task-definition.json > new-task-definition.json

          echo ""
          echo "New task definition container images:"
          
          jq -r '
            .containerDefinitions[]
            | "Container: \(.name) | Image: \(.image)"
          ' new-task-definition.json

      # --------------------------------------------------------
      # Register new ECS task definition revision
      # --------------------------------------------------------
      - name: Register new task definition
        id: register
        run: |

          echo "=========================================="
          echo "Registering new ECS task definition"
          echo "=========================================="

          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "$NEW_TASK_DEFINITION" ] || [ "$NEW_TASK_DEFINITION" = "None" ]; then
            echo "Failed to register new task definition"
            exit 1
          fi

          echo "New task definition:"
          echo "$NEW_TASK_DEFINITION"

          echo "task_definition=$NEW_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Update ECS service
      # --------------------------------------------------------
      - name: Deploy new task definition
        run: |

          echo "=========================================="
          echo "Starting ECS deployment"
          echo "=========================================="

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register.outputs.task_definition }}"

      # --------------------------------------------------------
      # Wait for ECS deployment
      # --------------------------------------------------------
      - name: Wait for ECS service stability
        run: |

          echo "=========================================="
          echo "Waiting for ECS service to become stable"
          echo "=========================================="

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "=========================================="
          echo "ECS deployment completed successfully"
          echo "=========================================="

      # --------------------------------------------------------
      # Show final ECS task definition
      # --------------------------------------------------------
      - name: Show deployed image
        run: |

          echo "=========================================="
          echo "Deployed ECS task"
          echo "=========================================="

          FINAL_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Task definition:"
          echo "$FINAL_TASK_DEFINITION"

          aws ecs describe-task-definition \
            --task-definition "$FINAL_TASK_DEFINITION" \
            --query 'taskDefinition.containerDefinitions[].{Container:name,Image:image}' \
            --output table
