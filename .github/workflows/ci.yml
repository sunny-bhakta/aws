name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run unit tests
        run: npm test

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: devops-nestjs-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 3000:3000 devops-nestjs-app:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then
              echo "" && echo "health check OK"
              exit 0
            fi
            sleep 1
          done
          echo "container failed to become healthy"
          docker logs app
          exit 1

      - name: Show image size
        if: always()
        run: docker image ls devops-nestjs-app:ci

      - name: Cleanup
        if: always()
        run: docker rm -f app || true

  push-to-ecr:
    name: push-to-ecr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'ap-south-1' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required AWS variables
        run: |
          test -n "${{ vars.AWS_ROLE_ARN }}" || (echo "Missing repo variable: AWS_ROLE_ARN" && exit 1)

      - name: Debug OIDC claims
        run: |
          echo "repo:         ${{ github.repository }}"
          echo "ref:          ${{ github.ref }}"
          echo "event:        ${{ github.event_name }}"
          echo "role:         ${{ vars.AWS_ROLE_ARN }}"
          echo "region:       ${{ env.AWS_REGION }}"
          echo "expected sub: repo:${{ github.repository }}:ref:${{ github.ref }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ecs:
    name: deploy-to-ecs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: push-to-ecr
    # Skips cleanly until ECS_CLUSTER and ECS_SERVICE are set as repo variables.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.ECS_CLUSTER != ''
      && vars.ECS_SERVICE != ''
    env:
      AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'ap-south-1' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate required AWS variables
        run: |
          test -n "${{ vars.AWS_ROLE_ARN }}" || (echo "Missing repo variable: AWS_ROLE_ARN" && exit 1)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"
