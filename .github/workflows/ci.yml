name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # 1. BUILD AND TEST
  # ============================================================
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run unit tests
        run: npm test


  # ============================================================
  # 2. BUILD DOCKER IMAGE + SMOKE TEST
  # ============================================================
  docker:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - build-and-test

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Temporary verification
      # Make sure GitHub is using YOUR Dockerfile
      # --------------------------------------------------------
      - name: Verify Dockerfile
        run: |
          echo "=========================================="
          echo "Docker build directory"
          echo "=========================================="

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Dockerfile:"
          echo "=========================================="

          cat ./Dockerfile

          echo "=========================================="

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: devops-nestjs-app:ci

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # Run container
      # --------------------------------------------------------
      - name: Smoke test the container
        run: |
          docker run -d \
            --name app \
            -p 3000:3000 \
            devops-nestjs-app:ci

          echo "Waiting for application..."

          for i in $(seq 1 20); do

            if curl -fsS http://localhost:3000/health; then
              echo ""
              echo "=========================================="
              echo "Health check OK"
              echo "=========================================="
              exit 0
            fi

            sleep 1

          done

          echo "=========================================="
          echo "Container failed to become healthy"
          echo "=========================================="

          docker logs app

          exit 1

      # --------------------------------------------------------
      # Show image information
      # --------------------------------------------------------
      - name: Show image size
        if: always()
        run: |
          echo "=========================================="
          echo "Docker image"
          echo "=========================================="

          docker image ls devops-nestjs-app:ci

      # --------------------------------------------------------
      # Cleanup
      # --------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker rm -f app || true


  # ============================================================
  # 3. PUSH IMAGE TO ECR
  # ============================================================
  push-to-ecr:
    name: push-to-ecr
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'ap-south-1' }}

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Validate GitHub variables
      # --------------------------------------------------------
      - name: Validate required AWS variables
        run: |

          test -n "${{ vars.AWS_ROLE_ARN }}" \
            || (
              echo "Missing repository variable: AWS_ROLE_ARN"
              exit 1
            )

          test -n "${{ vars.ECR_REPOSITORY }}" \
            || (
              echo "Missing repository variable: ECR_REPOSITORY"
              exit 1
            )

      # --------------------------------------------------------
      # OIDC DEBUG INFORMATION
      #
      # IMPORTANT:
      # We are NOT using github/actions-oidc-debugger.
      # That action is what was causing the Alpine/Go error.
      # --------------------------------------------------------
      - name: Debug OIDC claims
        run: |

          echo "=========================================="
          echo "        GitHub OIDC Debug Information"
          echo "=========================================="

          echo "repository:           ${{ github.repository }}"
          echo "repository_owner:     ${{ github.repository_owner }}"
          echo "repository_owner_id:  ${{ github.repository_owner_id }}"
          echo "repository_id:        ${{ github.repository_id }}"
          echo "ref:                  ${{ github.ref }}"
          echo "event:                ${{ github.event_name }}"
          echo "workflow:             ${{ github.workflow }}"
          echo "workflow_ref:         ${{ github.workflow_ref }}"

          echo ""
          echo "AWS role:"
          echo "${{ vars.AWS_ROLE_ARN }}"

          echo ""
          echo "AWS region:"
          echo "${{ env.AWS_REGION }}"

          echo ""
          echo "Expected OIDC audience:"
          echo "sts.amazonaws.com"

          echo ""
          echo "Expected OIDC subject:"
          echo "repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:ref:${{ github.ref }}"

          echo ""
          echo "=========================================="

      # --------------------------------------------------------
      # AWS OIDC LOGIN
      # --------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |

          echo "=========================================="
          echo "             AWS Identity"
          echo "=========================================="

          aws sts get-caller-identity

          echo "=========================================="

      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Buildx
      # --------------------------------------------------------
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Verify Dockerfile again
      # --------------------------------------------------------
      - name: Verify Dockerfile
        run: |

          echo "=========================================="
          echo "Dockerfile being used for ECR build"
          echo "=========================================="

          pwd

          echo ""
          echo "Dockerfile contents:"
          echo "=========================================="

          cat ./Dockerfile

          echo "=========================================="

      # --------------------------------------------------------
      # Build and push Docker image
      # --------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 4. DEPLOY TO ECS
  # ============================================================
  deploy-to-ecs:
    name: deploy-to-ecs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - push-to-ecr

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'ap-south-1' }}

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # Validate AWS role
      # --------------------------------------------------------
      - name: Validate required AWS variables
        run: |

          test -n "${{ vars.AWS_ROLE_ARN }}" \
            || (
              echo "Missing repository variable: AWS_ROLE_ARN"
              exit 1
            )

      # --------------------------------------------------------
      # AWS OIDC LOGIN
      # --------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |

          echo "=========================================="
          echo "             AWS Identity"
          echo "=========================================="

          aws sts get-caller-identity

          echo "=========================================="

      # --------------------------------------------------------
      # Validate ECS variables
      # --------------------------------------------------------
      - name: Validate required deployment variables
        run: |

          test -n "${{ vars.ECS_CLUSTER }}" \
            || (
              echo "Missing repository variable: ECS_CLUSTER"
              exit 1
            )

          test -n "${{ vars.ECS_SERVICE }}" \
            || (
              echo "Missing repository variable: ECS_SERVICE"
              exit 1
            )

      # --------------------------------------------------------
      # Force ECS deployment
      # --------------------------------------------------------
      - name: Force new ECS deployment
        run: |

          echo "=========================================="
          echo "Starting ECS deployment"
          echo "=========================================="

          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment

      # --------------------------------------------------------
      # Wait for ECS
      # --------------------------------------------------------
      - name: Wait for ECS service stability
        run: |

          echo "=========================================="
          echo "Waiting for ECS service to become stable"
          echo "=========================================="

          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}"

          echo "=========================================="
          echo "ECS deployment completed successfully"
          echo "=========================================="
